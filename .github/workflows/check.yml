name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Lint and regression tests
        run: nix flake check --option abort-on-warn true
      - name: Build CLI with shell checks
        run: nix build .#default --no-link --option abort-on-warn true
