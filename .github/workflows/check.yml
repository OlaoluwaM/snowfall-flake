name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Lint and regression tests
        run: nix flake check --option abort-on-warn true
      - name: Build CLI with shell checks
        run: nix build .#default --out-link result --option abort-on-warn true
      - name: Zsh completion terminal tests
        run: |
          nix shell --inputs-from . nixpkgs#python3 nixpkgs#zsh --command \
            python3 tests/test_completion.py --cli "$PWD/result/bin/flake"
      - name: Real terminal integration tests
        run: |
          nixpkgs_source=$(nix eval --impure --raw --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')
          nix shell --inputs-from . nixpkgs#python3 nixpkgs#git --command \
            python3 tests/test_interactive.py \
              --cli "$PWD/result/bin/flake" --nixpkgs "$nixpkgs_source"
